<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>doodlebird</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/DDpB5V8M/favicon.jpg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://i.ibb.co/XrgxxRwc/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/KjbyVs8D/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/1fMnTg4P/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.ibb.co/nqZ1HzgC/android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/zH4mFPDD/apple-touch-icon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Gaegu&family=Love+Ya+Like+A+Sister&family=Patrick+Hand+SC&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app-container">
        <canvas id="gameCanvas"></canvas>

        <!-- The HUD is visible only while the game is running. -->
        <div class="ui-layer">
            <div class="hud-header">
                <div id="score-badge" class="notebook-badge">SCORE: 0</div>
            </div>
        </div>

        <!-- Start screen -->
        <div id="start-screen" class="screen-overlay">
            <div class="start-panel">
                <h1 class="game-title">doodle<br>bird</h1>
                <p class="start-copy">flap through the pages<br>and mind the pipes</p>
                <button class="play-img-btn" id="start-btn" aria-label="Play game">
                    <img src="https://i.ibb.co/nM8RFdvJ/playgame.png" alt="play game">
                </button>
            </div>
        </div>

        <!-- Game-over screen -->
        <div id="game-over-screen" class="screen-overlay hidden">
            <div class="game-over-panel">
                <div class="score-notebook-card">
                    <img src="https://i.ibb.co/FqwJSRJ0/game-over.png" alt="game over" class="game-over-img">
                    <div class="score-row-item">
                        <span>Score</span>
                        <span id="end-score">0</span>
                    </div>
                    <div class="score-row-item">
                        <span>Best Record</span>
                        <span id="best-score">0</span>
                    </div>
                </div>
                <div class="game-over-actions">
                    <button class="restart-img-btn" id="retry-btn" aria-label="Restart game">
                        <img src="https://i.ibb.co/Lhd962RY/restart.png" alt="restart">
                    </button>
                    <button class="share-img-btn" id="share-btn" aria-label="Share game">
                        <img src="https://i.ibb.co/BVCYcdY5/share.png" alt="share">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
