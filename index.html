<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>doodlebird</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/DDpB5V8M/favicon.jpg">
    <link rel="icon" type="image/png" sizes="16x16" href="https://i.ibb.co/XrgxxRwc/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/KjbyVs8D/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/1fMnTg4P/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.ibb.co/nqZ1HzgC/android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/zH4mFPDD/apple-touch-icon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Gaegu&family=Love+Ya+Like+A+Sister&family=Patrick+Hand+SC&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="hud-header">
                <span class="notebook-badge">doodlebird</span>
                <div class="score-display" id="scoreBadge">SCORE: 0</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="screen-overlay" id="startScreen">
            <h1 class="game-title">doodlebird</h1>
            <div class="start-panel">
                <div class="start-kicker">FLAP & FLY</div>
                <p class="start-copy">Don't hit the pipes!</p>
                <button class="play-img-btn" id="startBtn">
                    <img src="https://i.ibb.co/7tQN9YrN/Group-8.png" alt="Play">
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="screen-overlay hidden" id="gameOverScreen">
            <h1 class="game-title">Game Over</h1>
            <div class="game-over-panel">
                <div class="score-section">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="endScore">0</div>
                </div>
                <div class="score-section">
                    <div class="score-label">BEST</div>
                    <div class="score-value" id="bestScore">0</div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: center;">
                    <button class="hand-crafted-btn" id="retryBtn">RETRY</button>
                    <button class="hand-crafted-btn" id="shareBtn">SHARE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
